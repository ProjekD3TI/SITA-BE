services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: portal_backend_app
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    env_file:
      - .env
    volumes:
      # Persistensi data upload dan file storage Laravel
      - ./storage/app:/app/storage/app
      # Mount file .env langsung dari host agar perubahan realtime terbaca di dalam container
      - ${HOME}/app-config/be/.env:/app/.env
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - portal_network

  mysql:
    image: mysql:8.0
    container_name: portal_backend_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-root}
      MYSQL_DATABASE: ${DB_DATABASE:-si-ta}
      MYSQL_USER: ${DB_USERNAME:-root}
      MYSQL_PASSWORD: ${DB_PASSWORD:-root}
    ports:
      - "${DB_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    networks:
      - portal_network
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h localhost -uroot -p$${MYSQL_ROOT_PASSWORD} || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  mysql_data:
    driver: local

networks:
  portal_network:
    driver: bridge
