name: 🚀 CI/CD Deploy with Docker Compose

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      run_migrations:
        description: 'Jalankan php artisan migrate secara manual?'
        required: false
        type: boolean
        default: false

jobs:
  deploy:
    name: 🐳 Deploy to Self-Hosted Server
    runs-on: self-hosted

    steps:
      - name: 🚚 Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 2 # Diperlukan untuk mendeteksi apakah ada perubahan file di database/migrations

      - name: ⚙️ Setup Environment (.env)
        run: |
          echo "Menghubungkan file .env dari $HOME/app-config/be/.env..."
          if [ -f "$HOME/app-config/be/.env" ]; then
            ln -sf "$HOME/app-config/be/.env" .env
            echo "✅ Symlink .env berhasil dibuat dari ~/app-config/be/.env"
          elif [ -f .env ]; then
            echo "ℹ️ ~/app-config/be/.env tidak ditemukan, menggunakan .env yang sudah ada di direktori kerja."
          else
            echo "❌ ERROR: File .env tidak ditemukan di $HOME/app-config/be/.env maupun di direktori kerja!"
            echo "Pastikan folder ~/app-config/be/ sudah dibuat dan file .env sudah di-upload."
            exit 1
          fi

      - name: 🏗️ Build & Run Docker Containers
        run: |
          echo "Menjalankan docker compose up..."
          docker compose up -d --build

      - name: ⏳ Wait for Containers to be Ready
        run: |
          echo "Menunggu layanan aplikasi dan database siap..."
          sleep 10

      - name: 🔄 Database Migration (Kondisional / Manual)
        run: |
          RUN_MIGRATE=false

          # 1. Cek jika dipicu manual via workflow_dispatch dengan opsi run_migrations = true
          if [ "${{ github.event.inputs.run_migrations }}" = "true" ]; then
            echo "⚡ Migrasi dipicu secara manual via Workflow Dispatch."
            RUN_MIGRATE=true
          # 2. Cek jika ada perubahan file di folder database/migrations pada commit terbaru
          elif git rev-parse HEAD~1 >/dev/null 2>&1; then
            MIGRATION_CHANGES=$(git diff --name-only HEAD~1 HEAD -- database/migrations/ || true)
            if [ -n "$MIGRATION_CHANGES" ]; then
              echo "📝 Terdeteksi file migrasi baru atau diperbarui:"
              echo "$MIGRATION_CHANGES"
              RUN_MIGRATE=true
            fi
          fi

          if [ "$RUN_MIGRATE" = "true" ]; then
            echo "🚀 Menjalankan migrasi database..."
            docker compose exec -T app php artisan migrate --force
          else
            echo "⏩ Tidak ada file migrasi baru & tidak dipilih manual. Melewati php artisan migrate."
          fi

      - name: ⚙️ Post-Deployment Tasks
        run: |
          echo "Membuat symlink storage..."
          docker compose exec -T app php artisan storage:link || true

          echo "Optimasi cache konfigurasi dan route Laravel..."
          docker compose exec -T app php artisan optimize:clear
          docker compose exec -T app php artisan optimize

          echo "Mengatur hak akses storage dan cache..."
          docker compose exec -T app chmod -R 775 storage bootstrap/cache || true

      - name: 🧹 Cleanup Dangling Docker Images
        if: always()
        run: |
          echo "Membersihkan image Docker yang tidak terpakai..."
          docker image prune -f
